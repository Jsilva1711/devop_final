version: "3"
services:
  ctf-admin:
    build:
      context: .
      dockerfile: Dockerfile.ctf-admin
    container_name: ctf-admin
    volumes:
      - ./ansible-playbooks:/ansible-playbooks
    networks:
      - ctf-network
    command: ["tail", "-f", "/dev/null"]

  red-team:
    build:
      context: .
      dockerfile: Dockerfile.ctf
    container_name: red-team
    networks:
      - ctf-network
    ports:
      - "6000:22"
      - "6001:5000"
      - "6002:5001"

  fuchsia-team:
    build:
      context: .
      dockerfile: Dockerfile.ctf
    container_name: fuchsia-team
    networks:
      - ctf-network
    ports:
      - "6010:22"
      - "6011:5000"
      - "6012:5001"

networks:
  ctf-network:
